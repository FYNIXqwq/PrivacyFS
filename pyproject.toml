[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfs"
version = "0.2.0a1"
description = "Scan directories and produce anonymized file listings for AI tools"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.2,<0.28",
    "rich>=15,<16",
    "pyyaml>=6.0.3,<7",
    "pathspec>=0.12,<2",
    "jieba==0.42.1",
    "setuptools>=68,<81",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "pypinyin>=0.55,<0.56",
    "pypdf>=6.17,<7",
    "defusedxml>=0.7.1,<0.8",
    "piexif>=1.1.3,<2",
    "textual>=8.2,<9",
    "regex>=2024.11.6,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pillow>=10,<13"]
hanlp = ["hanlp"]
gui = ["slint==1.9.2a1"]
local-ai = ["llama-cpp-python==0.3.35"]

[project.scripts]
privacyfs = "privacyfs.cli:entrypoint"

[project.gui-scripts]
privacyfs-workbench = "privacyfs.workbench.app:main"

[tool.setuptools.package-data]
"privacyfs.gui" = ["*.slint"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".review/pytest-cache"
