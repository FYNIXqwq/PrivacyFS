name: tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q -rs
      - run: python evals/run_d1.py --split validation
      - run: python evals/run_d2.py --split validation
      - run: python evals/run_d3.py --split validation
      - run: python evals/run_d4.py --split validation
      - run: python evals/run_d5.py --split validation
      - run: python evals/run_effectiveness.py --split validation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test evals/pi/attack-harness.test.mjs
