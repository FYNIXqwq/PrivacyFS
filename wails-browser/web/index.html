<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrivacyFS · 目录浏览器</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header"><div class="brand"><span class="brand-icon">P</span><div><strong>PrivacyFS</strong><span>目录浏览器</span></div></div><div class="header-note"><i></i>本地运行 <span class="divider">/</span> 只读扫描</div></header>
<main>
<section class="intro"><div><div class="eyebrow">FILE EXPLORER</div><h1>先看清你的文件结构</h1><p>选择目录，扫描名称与层级，按需展开浏览。</p></div><span class="stage-pill">第一步 · 目录结构</span></section>
<section class="source-panel"><label for="root-path">扫描目录</label><div class="source-row"><div class="path-field"><span>▱</span><input id="root-path" placeholder="选择目录，或输入 C:\Users\…" autocomplete="off" spellcheck="false"></div><button id="choose" class="secondary">选择目录…</button><button id="scan" class="primary">开始扫描 <span>→</span></button><button id="cancel" class="danger" hidden>停止扫描</button></div><div class="source-bottom"><div><label for="mode">读取方式</label><select id="mode"><option value="auto">NTFS 优先 · 不可用时普通遍历</option><option value="ntfs">仅 NTFS 索引 · 需要卷读取权限</option><option value="walk">普通目录遍历</option></select></div><span>仅读取名称和属性，不读取文档正文</span></div></section>
<section class="metrics"><article><span id="records-label">已读取条目</span><strong id="records">—</strong></article><article><span>文件</span><strong id="files">—</strong></article><article><span>目录</span><strong id="folders">—</strong></article><article class="state-card"><span>扫描状态</span><strong id="state">尚未开始</strong><small id="elapsed">准备就绪</small></article></section>
<div class="status-strip" role="status"><span id="pulse" class="status-dot"></span><span id="message">选择目录后开始扫描</span><span id="backend" class="backend">等待选择</span></div><div id="notice" class="notice" hidden></div><div id="error" class="error" role="alert" hidden></div>
<section class="explorer"><aside><div class="panel-title"><strong>目录结构</strong><div><button id="expand-all" title="展开所有目录">全部展开</button><button id="collapse-all" title="收起所有目录">全部折叠</button></div></div><div id="tree" class="virtual-viewport" role="tree" tabindex="0" aria-label="目录结构"><div id="tree-space" class="virtual-space"></div></div></aside><div class="file-panel"><div class="file-toolbar"><nav id="breadcrumbs" aria-label="当前目录">尚未选择目录</nav><button id="refresh" class="icon-button" title="刷新当前目录" disabled>↻</button></div><div class="list-heading"><span>名称</span><span>类型</span></div><div class="content-area"><div id="list-scroll" class="virtual-viewport" tabindex="0" aria-label="文件与目录列表"><div id="list-space" class="virtual-space"></div></div><div id="empty" class="empty-state"><svg viewBox="0 0 96 80" width="104" aria-hidden="true"><path d="M8 23h31l9 9h40v39H8z" fill="#dcebe5"/><path d="M8 23V12h29l9 11h42v48H8z" fill="none" stroke="#709488" stroke-width="2.5"/><path d="M8 34h80" stroke="#709488" stroke-width="2.5"/></svg><h2>从一个目录开始</h2><p>全部条目通过连续滚动浏览。<br>双击文件夹，或在左侧展开目录。</p></div></div><div class="list-footer"><span id="item-info">连续滚动浏览完整列表</span><label>定位到第 <input id="jump" type="number" min="1" value="1" aria-label="定位条目序号"> 项 <button id="jump-go">前往</button></label></div></div></section>
<footer><span id="scope-note">当前版本只做目录浏览，不执行隐私检测。</span><span id="memory">Wails 3 · Go</span></footer>
</main><script type="module" src="main.js"></script></body></html>
